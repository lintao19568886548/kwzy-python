components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: page_size
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 20 }
    ParkIdPath:
      name: park_id
      in: path
      required: true
      schema: { type: integer, format: int64 }
    UnitIdPath:
      name: unit_id
      in: path
      required: true
      schema: { type: integer, format: int64 }
    LeaseIdPath:
      name: lease_id
      in: path
      required: true
      schema: { type: integer, format: int64 }
    BillIdPath:
      name: bill_id
      in: path
      required: true
      schema: { type: integer, format: int64 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 128
      description: 写操作幂等键（payments 创建、bills issue 等必须支持；1–128 字符，不作为授权边界）

  schemas:
    # ----- 统一响应 envelope（P0-3）-----
    ApiEnvelopeOk:
      type: object
      required: [code, message, data]
      properties:
        code: { type: string, example: OK }
        message: { type: string, example: success }
        data: { type: object, nullable: true }

    ErrorResponse:
      type: object
      required: [code, message, data]
      properties:
        code: { type: string, example: VALIDATION_ERROR }
        message: { type: string }
        data: { type: object, nullable: true }

    PageAccessProofResponse:
      type: object
      properties:
        code: { type: string, example: OK }
        message: { type: string }
        data:
          type: object
          properties:
            page_access_proof: { type: string }
            expires_in: { type: integer }

    PermissionCodesResponse:
      type: object
      properties:
        code: { type: string, example: OK }
        message: { type: string }
        data:
          type: object
          properties:
            codes:
              type: array
              items: { type: string }

    PartyEnvelope:
      type: object
      properties:
        code: { type: string }
        message: { type: string }
        data:
          $ref: '#/components/schemas/Party'
    PartyPageEnvelope:
      type: object
      properties:
        code: { type: string }
        message: { type: string }
        data:
          $ref: '#/components/schemas/PartyPage'
    PartyRoleEnvelope:
      type: object
      properties:
        code: { type: string }
        message: { type: string }
        data:
          $ref: '#/components/schemas/PartyRole'
    PartyRoleListEnvelope:
      type: object
      properties:
        code: { type: string }
        message: { type: string }
        data:
          type: array
          items:
            $ref: '#/components/schemas/PartyRole'
    PartyParkRelationEnvelope:
      type: object
      properties:
        code: { type: string }
        message: { type: string }
        data:
          $ref: '#/components/schemas/PartyParkRelation'
    PartyParkRelationListEnvelope:
      type: object
      properties:
        code: { type: string }
        message: { type: string }
        data:
          type: array
          items:
            $ref: '#/components/schemas/PartyParkRelation'
    PartyContactEnvelope:
      type: object
      properties:
        code: { type: string }
        message: { type: string }
        data:
          $ref: '#/components/schemas/PartyContact'
    PartyContactListEnvelope:
      type: object
      properties:
        code: { type: string }
        message: { type: string }
        data:
          type: array
          items:
            $ref: '#/components/schemas/PartyContact'
    PartyAddressEnvelope:
      type: object
      properties:
        code: { type: string }
        message: { type: string }
        data:
          $ref: '#/components/schemas/PartyAddress'
    PartyAddressListEnvelope:
      type: object
      properties:
        code: { type: string }
        message: { type: string }
        data:
          type: array
          items:
            $ref: '#/components/schemas/PartyAddress'
    PartyRiskEventListEnvelope:
      type: object
      properties:
        code: { type: string }
        message: { type: string }
        data:
          type: array
          items:
            $ref: '#/components/schemas/PartyRiskEvent'

    BuildingEnvelope:
      type: object
      properties:
        code: { type: string }
        message: { type: string }
        data:
          $ref: '#/components/schemas/Building'

    BuildingUpdate:
      type: object
      properties:
        name: { type: string }
        building_type: { type: string }
        address: { type: string }
        description: { type: string }

    PartyUpdate:
      type: object
      properties:
        name: { type: string }
        party_type: { type: string, enum: [ORGANIZATION, PERSON] }
        contact_name: { type: string, nullable: true }
        contact_phone: { type: string, nullable: true }
        credit_code: { type: string, nullable: true }
        status: { type: string, enum: [ACTIVE, INACTIVE, ARCHIVED] }
        remark: { type: string, nullable: true }
      description: |
        主档更新。禁止 risk_status 经此接口变更；禁止主档 address/park_id。

    PartyRestoreBody:
      type: object
      properties:
        target_status: { type: string, enum: [ACTIVE, INACTIVE], default: ACTIVE }

    PartyRoleCreate:
      type: object
      required: [role_code]
      properties:
        role_code:
          type: string
          enum: [PROPERTY_OWNER, LESSEE, BROKER, SUPPLIER, PARTNER, CUSTOMER]

    PartyParkRelationCreate:
      type: object
      required: [park_id, party_role_id]
      properties:
        park_id: { type: integer, format: int64 }
        party_role_id: { type: integer, format: int64 }

    PartyContactCreate:
      type: object
      properties:
        name: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        email: { type: string, nullable: true }
        role_label: { type: string, nullable: true }
        is_primary: { type: boolean, default: false }

    PartyContactUpdate:
      type: object
      properties:
        name: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        email: { type: string, nullable: true }
        role_label: { type: string, nullable: true }
        is_primary: { type: boolean, nullable: true }

    PartyAddressCreate:
      type: object
      properties:
        address_type:
          type: string
          enum: [REGISTERED, OFFICE, MAILING, BILLING, OTHER]
          default: OTHER
        country_code: { type: string, nullable: true }
        province: { type: string, nullable: true }
        city: { type: string, nullable: true }
        district: { type: string, nullable: true }
        street: { type: string, nullable: true }
        detail: { type: string, nullable: true }
        postal_code: { type: string, nullable: true }
        is_primary: { type: boolean, default: false }

    PartyAddressUpdate:
      type: object
      properties:
        country_code: { type: string, nullable: true }
        province: { type: string, nullable: true }
        city: { type: string, nullable: true }
        district: { type: string, nullable: true }
        street: { type: string, nullable: true }
        detail: { type: string, nullable: true }
        postal_code: { type: string, nullable: true }
        is_primary: { type: boolean, nullable: true }
        status: { type: string, nullable: true }

    PartyRiskReasonBody:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 1 }

    ApiOk:
      description: Prefer ApiEnvelopeOk — same envelope shape
      type: object
      properties:
        code: { type: string, default: OK }
        message: { type: string, default: success }
        data: { type: object, nullable: true }

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string, format: password }
        tenant_code: { type: string, nullable: true, description: 多租户同名用户必须指定 }

    TokenPair:
      type: object
      properties:
        access_token: { type: string }
        token_type: { type: string, default: bearer }
        expires_in: { type: integer }

    LoginResponse:
      allOf:
        - $ref: '#/components/schemas/TokenPair'
        - type: object
          properties:
            user:
              $ref: '#/components/schemas/UserInfo'

    UserInfo:
      type: object
      properties:
        id: { type: integer, format: int64 }
        tenant_id: { type: integer, format: int64 }
        username: { type: string }
        real_name: { type: string }
        phone: { type: string, nullable: true }
        permissions:
          type: array
          items: { type: string }
          description: |
            动作权限码列表。`*` 表示全部动作权限，不授予全园区数据范围。
        park_ids:
          type: array
          items: { type: integer, format: int64 }
          description: |
            LIST 模式下可访问的园区 id 并集；ALL/NONE 时通常为空数组。
        park_scope_mode:
          type: string
          enum: [NONE, LIST, ALL]
          description: |
            园区数据范围模式，与 permissions 正交。
            ALL=租户内全部园区；LIST=park_ids；NONE=无园区访问。

    Park:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        address: { type: string }
        area: { type: number }
        contact: { type: string, nullable: true }
        manager: { type: string, nullable: true }
        status: { type: string }
    ParkCreate:
      type: object
      required: [name, address]
      properties:
        name: { type: string }
        address: { type: string }
        area: { type: number }
        contact: { type: string }
        manager: { type: string }
        description: { type: string }
    ParkUpdate:
      type: object
      properties:
        name: { type: string }
        address: { type: string }
        area: { type: number }
        contact: { type: string }
        manager: { type: string }
        status: { type: string }
        description: { type: string }
    ParkPage:
      type: object
      properties:
        total: { type: integer }
        page: { type: integer }
        page_size: { type: integer }
        items:
          type: array
          items:
            $ref: '#/components/schemas/Park'

    Building:
      type: object
      properties:
        id: { type: integer, format: int64 }
        park_id: { type: integer, format: int64 }
        name: { type: string }
        building_type: { type: string }
        address: { type: string }
    BuildingCreate:
      type: object
      required: [name]
      properties:
        name: { type: string }
        building_type: { type: string, default: FACTORY }
        address: { type: string }
        description: { type: string }

    Unit:
      type: object
      properties:
        id: { type: integer, format: int64 }
        park_id: { type: integer, format: int64 }
        building_id: { type: integer, format: int64 }
        code: { type: string }
        name: { type: string }
        rentable_area: { type: number }
        used_area: { type: number }
        base_rent_price: { type: number }
        status: { type: string }
        attributes: { type: object, additionalProperties: true }
    UnitCreate:
      type: object
      required: [park_id, building_id, code, name]
      properties:
        park_id: { type: integer, format: int64 }
        building_id: { type: integer, format: int64 }
        code: { type: string }
        name: { type: string }
        rentable_area: { type: number }
        base_rent_price: { type: number }
        attributes: { type: object, additionalProperties: true }
    UnitUpdate:
      type: object
      properties:
        name: { type: string }
        rentable_area: { type: number }
        base_rent_price: { type: number }
        status: { type: string }
        attributes: { type: object, additionalProperties: true }
    UnitPage:
      type: object
      properties:
        total: { type: integer }
        page: { type: integer }
        page_size: { type: integer }
        items:
          type: array
          items:
            $ref: '#/components/schemas/Unit'

    Party:
      type: object
      description: |
        租户级主体主档。无 park_id 归属字段；园区关联见 park_relations 子资源。
        无主档 address 自由文本事实字段；地址见 addresses 子资源。
      properties:
        id: { type: integer, format: int64 }
        tenant_id: { type: integer, format: int64 }
        party_type: { type: string, enum: [ORGANIZATION, PERSON] }
        name: { type: string }
        contact_name: { type: string, nullable: true }
        contact_phone: { type: string, nullable: true }
        credit_code: { type: string, nullable: true }
        status: { type: string, enum: [ACTIVE, INACTIVE, ARCHIVED] }
        risk_status: { type: string, enum: [NORMAL, BLACKLISTED] }
        blacklist_reason: { type: string, nullable: true }
        remark: { type: string, nullable: true }
        roles:
          type: array
          items:
            $ref: '#/components/schemas/PartyRole'
        park_relations:
          type: array
          items:
            $ref: '#/components/schemas/PartyParkRelation'
        created_at: { type: string, nullable: true }
        updated_at: { type: string, nullable: true }
    PartyCreate:
      type: object
      required: [name]
      properties:
        name: { type: string }
        party_type: { type: string, enum: [ORGANIZATION, PERSON], default: ORGANIZATION }
        contact_name: { type: string, nullable: true }
        contact_phone: { type: string, nullable: true }
        credit_code: { type: string, nullable: true }
        remark: { type: string, nullable: true }
        initial_park_relation:
          $ref: '#/components/schemas/InitialParkRelation'
      description: |
        创建主体。无主档 park_id/address。
        可选 initial_park_relation 为同事务组合命令，不写 Party 主档 park 列。
    InitialParkRelation:
      type: object
      required: [park_id]
      properties:
        park_id: { type: integer, format: int64 }
        party_role_id: { type: integer, format: int64, nullable: true }
        role_code: { type: string, nullable: true }
    PartyPage:
      type: object
      properties:
        total: { type: integer }
        page: { type: integer }
        page_size: { type: integer }
        items:
          type: array
          items:
            $ref: '#/components/schemas/Party'
    PartyRole:
      type: object
      properties:
        id: { type: integer, format: int64 }
        party_id: { type: integer, format: int64 }
        role_code: { type: string }
        status: { type: string }
    PartyParkRelation:
      type: object
      properties:
        id: { type: integer, format: int64 }
        park_id: { type: integer, format: int64 }
        party_role_id: { type: integer, format: int64 }
        status: { type: string }
    PartyContact:
      type: object
      properties:
        id: { type: integer, format: int64 }
        party_id: { type: integer, format: int64 }
        name: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        email: { type: string, nullable: true }
        role_label: { type: string, nullable: true }
        is_primary: { type: boolean }
    PartyAddress:
      type: object
      properties:
        id: { type: integer, format: int64 }
        address_type: { type: string }
