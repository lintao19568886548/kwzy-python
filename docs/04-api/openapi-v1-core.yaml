openapi: 3.1.0
info:
  title: KWZY AI Smart Park API
  version: 1.1.0
  description: |
    AI 智慧园区平台核心主链 OpenAPI v1.1（05.1 修订）。
    统一 snake_case；统一响应 envelope；Payment=收款登记；Bill 无 OVERDUE 主状态。
    覆盖：认证、园区/单元、合同、账单、收款催缴、招商 CRM 漏斗与线索转化。
    响应约定：成功/失败均为 {code, message, data}；错误见 ErrorResponse。
    路径与字段一律 snake_case。
servers:
  - url: http://localhost:8000/api/v1
    description: Local
tags:
  - name: Auth
  - name: Parks
  - name: Units
  - name: Parties
  - name: Leases
  - name: Bills
  - name: Payments
  - name: Collection
  - name: TenantService
  - name: WorkItems
  - name: OrganizationGovernance
  - name: Approvals
  - name: Audit
  - name: Leads
  - name: AI

paths:
  /auth/login:
    post:
      tags: [Auth]
      summary: 密码登录
      operationId: authLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'

  /auth/refresh:
    post:
      tags: [Auth]
      summary: 刷新访问令牌
      operationId: authRefresh
      description: PC 优先使用 HttpOnly SameSite cookie；移动端可在请求体提交 refresh_token。
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token: { type: string, minLength: 10 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'

  /auth/me:
    get:
      tags: [Auth]
      summary: 当前用户信息
      operationId: authMe
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInfo'


  /auth/page-access/send:
    post:
      tags: [Auth]
      summary: 发送高敏页面验证码（如催缴）
      operationId: authPageAccessSend
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [purpose]
              properties:
                purpose:
                  type: string
                  description: 小写业务用途标识
                  example: contract.terminate
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelopeOk'

  /auth/page-access/verify:
    post:
      tags: [Auth]
      summary: 校验验证码并签发 page_access_proof
      operationId: authPageAccessVerify
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [purpose, code]
              properties:
                purpose: { type: string }
                code: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageAccessProofResponse'

  /auth/page-access/consume:
    post:
      tags: [Auth]
      summary: 校验并一次性消费 page-access proof
      operationId: authPageAccessConsume
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [purpose, proof]
              properties:
                purpose: { type: string, example: contract.terminate }
                proof: { type: string, minLength: 32 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelopeOk'

  /auth/codes:
    get:
      tags: [Auth]
      summary: 当前用户权限码列表
      operationId: authCodes
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionCodesResponse'

  /auth/logout:
    post:
      tags: [Auth]
      summary: 登出（作废 refresh）
      operationId: authLogout
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelopeOk'

  /auth/password:
    post:
      tags: [Auth]
      summary: 修改当前用户密码
      operationId: authChangePassword
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [old_password, new_password]
              properties:
                old_password: { type: string }
                new_password: { type: string, minLength: 10, maxLength: 72 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelopeOk'

  /auth/menus:
    get:
      tags: [Auth]
      summary: 当前用户动态菜单
      operationId: authMenus
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelopeOk'

  /system/users:
    get:
      tags: [System]
      summary: 用户列表
      operationId: systemUsersList
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
    post:
      tags: [System]
      summary: 创建用户
      operationId: systemUsersCreate
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK

  /system/users/{user_id}:
    put:
      tags: [System]
      summary: 更新用户
      operationId: systemUsersUpdate
      security: [{ bearerAuth: [] }]
      parameters:
        - name: user_id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: OK
    delete:
      tags: [System]
      summary: 停用用户
      operationId: systemUsersDisable
      security: [{ bearerAuth: [] }]
      parameters:
        - name: user_id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: OK

  /system/users/{user_id}/revoke-sessions:
    post:
      tags: [System]
      summary: 撤销用户全部 access/refresh 会话
      operationId: systemUsersRevokeSessions
      security: [{ bearerAuth: [] }]
      parameters:
        - name: user_id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: OK

  /system/roles:
    get:
      tags: [System]
      summary: 角色列表
      operationId: systemRolesList
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
    post:
      tags: [System]
      summary: 创建角色
      operationId: systemRolesCreate
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK

  /system/roles/{role_id}:
    put:
      tags: [System]
      summary: 更新角色
      operationId: systemRolesUpdate
      security: [{ bearerAuth: [] }]
      parameters:
        - name: role_id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: OK

  /system/permissions:
    get:
      tags: [System]
      summary: 权限码字典
      operationId: systemPermissionsList
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK

  /system/menus:
    get:
      tags: [System]
      summary: 菜单列表
      operationId: systemMenusList
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
    post:
      tags: [System]
      summary: 创建菜单
      operationId: systemMenusCreate
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK

  /system/menus/{menu_id}:
    put:
      tags: [System]
      summary: 更新菜单
      operationId: systemMenusUpdate
      security: [{ bearerAuth: [] }]
      parameters:
        - name: menu_id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: OK
    delete:
      tags: [System]
      summary: 停用菜单及其子菜单
      operationId: systemMenusDeactivate
      security: [{ bearerAuth: [] }]
      parameters:
        - name: menu_id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: OK

  /parks:
    get:
      tags: [Parks]
      summary: 园区列表
      operationId: listParks
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: keyword
          in: query
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParkPage'
    post:
      tags: [Parks]
      summary: 创建园区
      operationId: createPark
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParkCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Park'

  /parks/{park_id}:
    get:
      tags: [Parks]
      summary: 园区详情
      operationId: getPark
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ParkIdPath'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Park'
    patch:
      tags: [Parks]
      summary: 更新园区
      operationId: updatePark
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ParkIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParkUpdate'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Park'

  /parks/{park_id}/buildings:
    get:
      tags: [Parks]
      summary: 楼栋列表
      operationId: listBuildings
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ParkIdPath'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Building'
    post:
      tags: [Parks]
      summary: 创建楼栋
      operationId: createBuilding
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ParkIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BuildingCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Building'


  /buildings/{building_id}:
    get:
      tags: [Parks]
      summary: 楼栋详情
      operationId: getBuilding
      security: [{ bearerAuth: [] }]
      parameters:
        - name: building_id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuildingEnvelope'
    patch:
      tags: [Parks]
      summary: 更新楼栋
      operationId: updateBuilding
      security: [{ bearerAuth: [] }]
      parameters:
        - name: building_id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BuildingUpdate'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuildingEnvelope'
    delete:
      tags: [Parks]
      summary: 删除楼栋（软删）
      operationId: deleteBuilding
      security: [{ bearerAuth: [] }]
      parameters:
        - name: building_id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelopeOk'

  /spaces/tree:
    get:
      tags: [Units]
      summary: 查询园区空间树
      operationId: spatialTree
      security: [{ bearerAuth: [] }]
      parameters:
        - name: park_id
          in: query
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200': { description: OK }

  /spaces:
    post:
      tags: [Units]
      summary: 创建空间节点
      operationId: createSpatialNode
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SpatialCreate' }
      responses:
        '200': { description: OK }

  /spaces/{node_id}:
    parameters:
      - name: node_id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      tags: [Units]
      summary: 空间节点详情
      operationId: getSpatialNode
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK }
    patch:
      tags: [Units]
      summary: 更新或移动空间节点
      operationId: updateSpatialNode
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SpatialUpdate' }
      responses:
        '200': { description: OK }
    delete:
      tags: [Units]
      summary: 停用空间节点
      operationId: deactivateSpatialNode
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK }

  /asset-templates:
    get:
      tags: [Units]
      summary: 查询当前租户的资产模板及版本
      operationId: listAssetTemplates
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK }
    post:
      tags: [Units]
      summary: 创建资产模板草稿
      operationId: createAssetTemplate
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssetTemplateCreate' }
      responses:
        '200': { description: Created }
        '409': { description: 模板编码冲突 }

  /asset-templates/{template_id}:
    parameters:
      - $ref: '#/components/parameters/AssetTemplateIdPath'
    get:
      tags: [Units]
      summary: 查询资产模板及其不可变版本链
      operationId: getAssetTemplate
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK }
        '404': { description: 模板不存在或不属于当前租户 }

  /asset-templates/{template_id}/draft:
    parameters:
      - $ref: '#/components/parameters/AssetTemplateIdPath'
    put:
      tags: [Units]
      summary: 以乐观锁更新当前模板草稿
      operationId: updateAssetTemplateDraft
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssetTemplateDraftUpdate' }
      responses:
        '200': { description: Updated }
        '409': { description: 版本冲突或当前版本不是草稿 }

  /asset-templates/{template_id}/publish:
    parameters:
      - $ref: '#/components/parameters/AssetTemplateIdPath'
    post:
      tags: [Units]
      summary: 发布不可变资产模板版本
      operationId: publishAssetTemplate
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExpectedVersionCommand' }
      responses:
        '200': { description: Published }
        '409': { description: 版本冲突或当前版本不是草稿 }

  /asset-templates/{template_id}/drafts:
    parameters:
      - $ref: '#/components/parameters/AssetTemplateIdPath'
    post:
      tags: [Units]
      summary: 从已发布版本派生下一草稿
      operationId: createAssetTemplateDraft
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExpectedVersionCommand' }
      responses:
        '200': { description: Draft created }
        '409': { description: 版本冲突或存在未关闭草稿 }

  /asset-templates/{template_id}/retire:
    parameters:
      - $ref: '#/components/parameters/AssetTemplateIdPath'
    post:
      tags: [Units]
      summary: 停用资产模板但保留历史版本引用
      operationId: retireAssetTemplate
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExpectedVersionCommand' }
      responses:
        '200': { description: Retired }
        '409': { description: 版本冲突 }

  /units:
    get:
      tags: [Units]
      summary: 可租单元列表
      operationId: listUnits
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: park_id
          in: query
          schema: { type: integer, format: int64 }
        - name: status
          in: query
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnitPage'
    post:
      tags: [Units]
      summary: 创建可租单元
      operationId: createUnit
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnitCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unit'

  /units/{unit_id}:
    get:
      tags: [Units]
      summary: 单元详情
      operationId: getUnit
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/UnitIdPath'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unit'
    patch:
      tags: [Units]
      summary: 更新单元
      operationId: updateUnit
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/UnitIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnitUpdate'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unit'

  /units/split:
    post:
      tags: [Units]
      summary: 原子拆分空置单元
      operationId: splitUnit
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UnitSplitRequest' }
      responses:
        '200': { description: OK }
        '409': { description: 占用、版本或编码冲突 }

  /units/merge:
    post:
      tags: [Units]
      summary: 原子合并空置单元
      operationId: mergeUnits
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UnitMergeRequest' }
      responses:
        '200': { description: OK }
        '409': { description: 占用、版本或编码冲突 }

  /units/{unit_id}/versions:
    post:
      tags: [Units]
      summary: 创建单元结构新版本
      operationId: createUnitVersion
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/UnitIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UnitVersionCreate' }
      responses:
        '200': { description: OK }
        '409': { description: 版本或占用冲突 }

  /units/{unit_id}/history:
    get:
      tags: [Units]
      summary: 单元版本历史
      operationId: unitHistory
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/UnitIdPath'
      responses:
        '200': { description: OK }

  /units/{unit_id}/lineage:
    get:
      tags: [Units]
      summary: 单元拆分合并来源关系
      operationId: unitLineage
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/UnitIdPath'
      responses:
        '200': { description: OK }

  /rent-control/summary:
    get:
      tags: [Units]
      summary: 租控库存与面积汇总
      operationId: rentControlSummary
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/RentControlParkId'
        - $ref: '#/components/parameters/RentControlSpaceId'
        - $ref: '#/components/parameters/RentControlStatus'
        - $ref: '#/components/parameters/RentControlUsageType'
        - $ref: '#/components/parameters/RentControlKeyword'
      responses:
        '200': { description: OK }

  /rent-control/units:
    get:
      tags: [Units]
      summary: 租控单元分页列表
      operationId: rentControlUnits
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/RentControlParkId'
        - $ref: '#/components/parameters/RentControlSpaceId'
        - $ref: '#/components/parameters/RentControlStatus'
        - $ref: '#/components/parameters/RentControlUsageType'
        - $ref: '#/components/parameters/RentControlKeyword'
      responses:
        '200': { description: OK }

  /rent-control/matrix:
    get:
      tags: [Units]
      summary: 按空间分组的租控矩阵
      operationId: rentControlMatrix
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/RentControlParkId'
        - $ref: '#/components/parameters/RentControlSpaceId'
        - $ref: '#/components/parameters/RentControlStatus'
        - $ref: '#/components/parameters/RentControlUsageType'
        - $ref: '#/components/parameters/RentControlKeyword'
      responses:
        '200': { description: OK }

  /rent-control/map:
    get:
      tags: [Units]
      summary: 基于真实空间坐标的租控 GeoJSON 投影
