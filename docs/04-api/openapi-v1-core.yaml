            schema: { $ref: '#/components/schemas/OrganizationRegionUpdate' }
      responses:
        '200': { $ref: '#/components/responses/OrganizationGovernanceOK' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /system/organization-governance/park-assignments:
    post:
      tags: [OrganizationGovernance]
      summary: 调整园区所属区域并保留历史
      operationId: organizationGovernanceAssignPark
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegionParkAssignmentCommand' }
      responses:
        '200': { $ref: '#/components/responses/OrganizationGovernanceOK' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /system/organization-governance/parks/{park_id}/assignment-history:
    get:
      tags: [OrganizationGovernance]
      summary: 查询园区调区历史
      operationId: organizationGovernanceParkHistory
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ParkIdPath'
      responses:
        '200': { $ref: '#/components/responses/OrganizationGovernanceOK' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /system/organization-governance/positions:
    get:
      tags: [OrganizationGovernance]
      summary: 查询岗位主档
      operationId: organizationGovernanceListPositions
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/OrganizationGovernanceOK' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [OrganizationGovernance]
      summary: 创建岗位主档
      operationId: organizationGovernanceCreatePosition
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PositionCreate' }
      responses:
        '200': { $ref: '#/components/responses/OrganizationGovernanceOK' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /system/organization-governance/positions/{position_id}:
    patch:
      tags: [OrganizationGovernance]
      summary: 更新或停用岗位主档
      operationId: organizationGovernanceUpdatePosition
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/PositionId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PositionUpdate' }
      responses:
        '200': { $ref: '#/components/responses/OrganizationGovernanceOK' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /system/organization-governance/user-assignments:
    get:
      tags: [OrganizationGovernance]
      summary: 查询用户任职与历史
      operationId: organizationGovernanceListUserAssignments
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: user_id
          schema: { type: integer, format: int64, minimum: 1 }
        - in: query
          name: current_only
          schema: { type: boolean, default: false }
      responses:
        '200': { $ref: '#/components/responses/OrganizationGovernanceOK' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [OrganizationGovernance]
      summary: 创建有效期用户任职
      operationId: organizationGovernanceAssignUserPosition
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserPositionAssignmentCreate' }
      responses:
        '200': { $ref: '#/components/responses/OrganizationGovernanceOK' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /system/organization-governance/user-assignments/{assignment_id}/end:
    post:
      tags: [OrganizationGovernance]
      summary: 结束当前任职
      operationId: organizationGovernanceEndUserPosition
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/AssignmentId'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserPositionAssignmentEnd' }
      responses:
        '200': { $ref: '#/components/responses/OrganizationGovernanceOK' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /system/organization-governance/protected-fields:
    get:
      tags: [OrganizationGovernance]
      summary: 查询可配置的受保护字段白名单
      operationId: organizationGovernanceListProtectedFields
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/OrganizationGovernanceOK' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /system/organization-governance/field-policies:
    get:
      tags: [OrganizationGovernance]
      summary: 查询角色字段访问策略
      operationId: organizationGovernanceListFieldPolicies
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/OrganizationGovernanceOK' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [OrganizationGovernance]
      summary: 创建或更新角色字段访问策略
      operationId: organizationGovernanceUpsertFieldPolicy
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FieldAccessPolicyUpsert' }
      responses:
        '200': { $ref: '#/components/responses/OrganizationGovernanceOK' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: page_size
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 20 }
    ParkIdPath:
      name: park_id
      in: path
      required: true
      schema: { type: integer, format: int64 }
    UnitIdPath:
      name: unit_id
      in: path
      required: true
      schema: { type: integer, format: int64 }
    RentControlParkId:
      name: park_id
      in: query
      schema: { type: integer, format: int64 }
    RentControlSpaceId:
      name: space_id
      in: query
      schema: { type: integer, format: int64 }
    RentControlStatus:
      name: status
      in: query
      schema: { type: string, enum: [DRAFT, VACANT, RESERVED, OCCUPIED, MAINTENANCE, RETIRED] }
    RentControlUsageType:
      name: usage_type
      in: query
      schema: { type: string }
    RentControlKeyword:
      name: keyword
      in: query
      schema: { type: string }
    LeaseIdPath:
      name: lease_id
      in: path
      required: true
      schema: { type: integer, format: int64 }
    ContractIdPath:
      name: contract_id
      in: path
      required: true
      schema: { type: integer, format: int64 }
    DocumentIdPath:
      name: document_id
      in: path
      required: true
      schema: { type: integer, format: int64 }
    ChangeIdPath:
      name: change_id
      in: path
      required: true
      schema: { type: integer, format: int64 }
    SettlementIdPath:
      name: settlement_id
      in: path
      required: true
      schema: { type: integer, format: int64 }
    BillIdPath:
      name: bill_id
      in: path
      required: true
      schema: { type: integer, format: int64 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 128
      description: 写操作幂等键（payments 创建、bills issue 等必须支持；1–128 字符，不作为授权边界）
    GroupId:
      name: group_id
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    RegionId:
      name: region_id
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    PositionId:
      name: position_id
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    AssignmentId:
      name: assignment_id
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }

  responses:
    ApiOkResponse:
      description: 统一成功响应
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiOk' }
    OrganizationGovernanceOK:
      description: 组织治理统一成功响应
      content:
        application/json:
          schema: { $ref: '#/components/schemas/OrganizationGovernanceEnvelope' }
    Forbidden:
      description: 动作权限、园区范围或租户边界拒绝
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Conflict:
      description: 生命周期、有效期或并发唯一约束冲突
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }

  schemas:
    # ----- 统一响应 envelope（P0-3）-----
    ApiEnvelopeOk:
      type: object
      required: [code, message, data]
      properties:
        code: { type: string, example: OK }
        message: { type: string, example: success }
        data: { type: object, nullable: true }

    ErrorResponse:
      type: object
      required: [code, message, data]
      properties:
        code: { type: string, example: VALIDATION_ERROR }
        message: { type: string }
        data: { type: object, nullable: true }

    OrganizationGovernanceEnvelope:
      type: object
      required: [code, message, data]
      properties:
        code: { type: string, example: OK }
        message: { type: string }
        data:
          description: 按端点返回层级、主档、历史或策略对象

    OrganizationLifecycleStatus:
      type: string
      enum: [ACTIVE, DISABLED]

    OrganizationGroupCreate:
      type: object
      required: [code, name]
      properties:
        code: { type: string, minLength: 1, maxLength: 64, pattern: '^[A-Za-z0-9_.-]+$' }
        name: { type: string, minLength: 1, maxLength: 128 }
        sort_order: { type: integer, minimum: -100000, maximum: 100000, default: 0 }
        remark: { type: string, maxLength: 500, nullable: true }

    OrganizationGroupUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 128 }
        status: { $ref: '#/components/schemas/OrganizationLifecycleStatus' }
        sort_order: { type: integer, minimum: -100000, maximum: 100000 }
        remark: { type: string, maxLength: 500, nullable: true }

    OrganizationRegionCreate:
      allOf:
        - $ref: '#/components/schemas/OrganizationGroupCreate'
        - type: object
          required: [group_id]
          properties:
            group_id: { type: integer, format: int64, minimum: 1 }

    OrganizationRegionUpdate:
      allOf:
        - $ref: '#/components/schemas/OrganizationGroupUpdate'
        - type: object
          properties:
            group_id: { type: integer, format: int64, minimum: 1 }

    RegionParkAssignmentCommand:
      type: object
      required: [region_id, park_id]
      properties:
        region_id: { type: integer, format: int64, minimum: 1 }
        park_id: { type: integer, format: int64, minimum: 1 }
        effective_from: { type: string, format: date-time, nullable: true }
        reason: { type: string, maxLength: 500, nullable: true }

    PositionCreate:
      type: object
      required: [code, name]
      properties:
        code: { type: string, minLength: 1, maxLength: 64, pattern: '^[A-Za-z0-9_.-]+$' }
        name: { type: string, minLength: 1, maxLength: 128 }
        org_unit_id: { type: integer, format: int64, minimum: 1, nullable: true }
        sort_order: { type: integer, minimum: -100000, maximum: 100000, default: 0 }
        responsibilities: { type: string, maxLength: 5000, nullable: true }

    PositionUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 128 }
        org_unit_id: { type: integer, format: int64, minimum: 1, nullable: true }
        clear_org_unit: { type: boolean, default: false }
        status: { $ref: '#/components/schemas/OrganizationLifecycleStatus' }
        sort_order: { type: integer, minimum: -100000, maximum: 100000 }
        responsibilities: { type: string, maxLength: 5000, nullable: true }

    UserPositionAssignmentCreate:
      type: object
      required: [user_id, position_id]
      properties:
        user_id: { type: integer, format: int64, minimum: 1 }
        position_id: { type: integer, format: int64, minimum: 1 }
        park_id: { type: integer, format: int64, minimum: 1, nullable: true }
        starts_at: { type: string, format: date-time, nullable: true }
        is_primary: { type: boolean, default: false }
        remark: { type: string, maxLength: 500, nullable: true }

    UserPositionAssignmentEnd:
      type: object
      properties:
        ends_at: { type: string, format: date-time, nullable: true }
        remark: { type: string, maxLength: 500, nullable: true }

    FieldAccessPolicyUpsert:
      type: object
      required: [role_id, resource_type, field_name, access_mode]
      properties:
        role_id: { type: integer, format: int64, minimum: 1 }
        resource_type: { type: string, enum: [USER] }
        field_name: { type: string, enum: [phone] }
        access_mode: { type: string, enum: [VISIBLE, MASKED, HIDDEN] }
        mask_strategy: { type: string, enum: [PHONE], default: PHONE }
        status: { $ref: '#/components/schemas/OrganizationLifecycleStatus' }

    LeaseVersionCommandV2:
      type: object
      required: [expected_version]
      properties:
        expected_version: { type: integer, minimum: 1 }
        remark: { type: string, maxLength: 1000, nullable: true }

    LeaseApprovalCommandV2:
      allOf:
        - $ref: '#/components/schemas/LeaseVersionCommandV2'
        - type: object
          required: [approval_id]
          properties:
            approval_id: { type: integer, minimum: 1 }
            override_reason: { type: string, maxLength: 1000, nullable: true }

    LeaseChargeLineV2:
      type: object
      required: [charge_code, charge_type, calculation_method, billing_cycle, start_date, end_date]
      properties:
        charge_code: { type: string, minLength: 1, maxLength: 64 }
        charge_type: { type: string, minLength: 1, maxLength: 32 }
        calculation_method: { type: string, enum: [FIXED, PER_AREA] }
        billing_cycle: { type: string, enum: [MONTHLY, QUARTERLY, SEMI_ANNUAL, ANNUAL, ONE_TIME] }
        currency: { type: string, default: CNY }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date }
        due_day: { type: integer, minimum: 1, maximum: 31, default: 1 }
        amount: { type: number, nullable: true }
        unit_price: { type: number, nullable: true }
        tax_rate: { type: number, default: 0 }
        sort_order: { type: integer, default: 0 }
        rules:
          type: array
          items: { type: object, additionalProperties: true }

    LeaseChargeReplaceV2:
      type: object
      required: [expected_version, charges]
      properties:
        expected_version: { type: integer, minimum: 1 }
        charges:
          type: array
          items: { $ref: '#/components/schemas/LeaseChargeLineV2' }

    LeaseSchedulePreviewV2:
      type: object
      required: [expected_version]
      properties:
        expected_version: { type: integer, minimum: 1 }
        charges:
          type: array
          nullable: true
          items: { $ref: '#/components/schemas/LeaseChargeLineV2' }

    LeaseDocumentCreateV2:
      type: object
      required: [expected_version, attachment_id, document_type, checksum]
      properties:
        expected_version: { type: integer, minimum: 1 }
        attachment_id: { type: integer, minimum: 1 }
        document_type: { type: string, minLength: 1, maxLength: 32 }
        checksum: { type: string, minLength: 64, maxLength: 64 }
        is_main: { type: boolean, default: false }
        exit_settlement_id: { type: integer, minimum: 1, nullable: true }

    LeaseDocumentCommandV2:
      type: object
      required: [expected_version]
      properties:
        expected_version: { type: integer, minimum: 1 }

    LeaseChangeCreateV2:
      type: object
      required: [expected_version, change_type, effective_date, reason, proposed_snapshot]
      properties:
        expected_version: { type: integer, minimum: 1 }
        change_type:
          type: string
          enum: [RENEWAL, EXPANSION, REDUCTION, UNIT_TRANSFER, PRICE_ADJUSTMENT, PARTY_TRANSFER, EARLY_TERMINATION]
        effective_date: { type: string, format: date }
        reason: { type: string, minLength: 1, maxLength: 2000 }
        proposed_snapshot: { type: object, additionalProperties: true }
        target_party_eligible: { type: boolean, nullable: true }

    LeaseChangeDecisionV2:
      type: object
      required: [expected_version]
      properties:
        expected_version: { type: integer, minimum: 1 }
        remark: { type: string, maxLength: 1000, nullable: true }
        override_reason: { type: string, maxLength: 1000, nullable: true }

    LeaseChangeApplyV2:
      type: object
      required: [expected_version, idempotency_key]
      properties:
        expected_version: { type: integer, minimum: 1 }
        idempotency_key: { type: string, minLength: 1, maxLength: 160 }
        as_of: { type: string, format: date, nullable: true }

    LeaseApplyDueV2:
      type: object
      properties:
        as_of: { type: string, format: date, nullable: true }
        limit: { type: integer, minimum: 1, maximum: 200, default: 100 }

    LeaseExitCreateV2:
      type: object
      required: [expected_version, handover_date]
      properties:
        expected_version: { type: integer, minimum: 1 }
        handover_date: { type: string, format: date }
        inspection_summary: { type: string, maxLength: 4000, nullable: true }

    LeaseExitItemV2:
      type: object
      required: [item_type, amount, description]
      properties:
        item_type: { type: string, minLength: 1, maxLength: 32 }
        amount: { type: number }
        description: { type: string, minLength: 1, maxLength: 255 }
        approved: { type: boolean, default: true }
        evidence_attachment_id: { type: integer, minimum: 1, nullable: true }
        source_type: { type: string, maxLength: 32, nullable: true }
        source_ref: { type: string, maxLength: 128, nullable: true }
        sort_order: { type: integer, default: 0 }

    LeaseExitEditV2:
      type: object
      required: [expected_version]
      properties:
        expected_version: { type: integer, minimum: 1 }
        inspection_summary: { type: string, maxLength: 4000, nullable: true }
        meter_readings:
          type: array
          items: { type: object, additionalProperties: true }
        items:
          type: array
          items: { $ref: '#/components/schemas/LeaseExitItemV2' }

    LeaseExitSubmitV2:
      type: object
      required: [expected_version, contract_expected_version]
      properties:
        expected_version: { type: integer, minimum: 1 }
        contract_expected_version: { type: integer, minimum: 1 }
        remark: { type: string, maxLength: 1000, nullable: true }

    LeaseExitDecisionV2:
      type: object
      required: [expected_version]
      properties:
        expected_version: { type: integer, minimum: 1 }
        remark: { type: string, maxLength: 1000, nullable: true }
        override_reason: { type: string, maxLength: 1000, nullable: true }

    LeaseExitClearanceV2:
      type: object
      required: [expected_version, evidence_attachment_id, reference, reason]
      properties:
        expected_version: { type: integer, minimum: 1 }
        evidence_attachment_id: { type: integer, minimum: 1 }
        reference: { type: string, minLength: 1, maxLength: 128 }
        reason: { type: string, minLength: 1, maxLength: 2000 }

    LeaseExitCloseV2:
      type: object
      required: [expected_version, contract_expected_version, idempotency_key]
      properties:
        expected_version: { type: integer, minimum: 1 }
        contract_expected_version: { type: integer, minimum: 1 }
        idempotency_key: { type: string, minLength: 1, maxLength: 160 }
        breached: { type: boolean, default: false }

    PageAccessProofResponse:
      type: object
      properties:
        code: { type: string, example: OK }
        message: { type: string }
        data:
          type: object
          properties:
            proof: { type: string }
            purpose: { type: string }
            expires_in: { type: integer }

    PermissionCodesResponse:
      type: object
      properties:
        code: { type: string, example: OK }
        message: { type: string }
        data:
          type: object
          properties:
            codes:
              type: array
              items: { type: string }

    PartyEnvelope:
      type: object
      properties:
        code: { type: string }
        message: { type: string }
        data:
          $ref: '#/components/schemas/Party'
    PartyPageEnvelope:
      type: object
      properties:
        code: { type: string }
        message: { type: string }
        data:
          $ref: '#/components/schemas/PartyPage'
    PartyRoleEnvelope:
      type: object
      properties:
        code: { type: string }
        message: { type: string }
        data:
          $ref: '#/components/schemas/PartyRole'
    PartyRoleListEnvelope:
      type: object
      properties:
        code: { type: string }
        message: { type: string }
        data:
          type: array
          items:
            $ref: '#/components/schemas/PartyRole'
    PartyParkRelationEnvelope:
      type: object
      properties:
        code: { type: string }
        message: { type: string }
        data:
          $ref: '#/components/schemas/PartyParkRelation'
    PartyParkRelationListEnvelope:
      type: object
      properties:
        code: { type: string }
        message: { type: string }
        data:
          type: array
          items:
            $ref: '#/components/schemas/PartyParkRelation'
    PartyContactEnvelope:
      type: object
      properties:
        code: { type: string }
        message: { type: string }
        data:
          $ref: '#/components/schemas/PartyContact'
    PartyContactListEnvelope:
      type: object
      properties:
        code: { type: string }
        message: { type: string }
        data:
          type: array
          items:
            $ref: '#/components/schemas/PartyContact'
    PartyAddressEnvelope:
      type: object
      properties:
        code: { type: string }
        message: { type: string }
        data:
          $ref: '#/components/schemas/PartyAddress'
    PartyAddressListEnvelope:
      type: object
      properties:
        code: { type: string }
        message: { type: string }
        data:
          type: array
          items:
            $ref: '#/components/schemas/PartyAddress'
    PartyRiskEventListEnvelope:
      type: object
      properties:
        code: { type: string }
        message: { type: string }
        data:
          type: array
          items:
            $ref: '#/components/schemas/PartyRiskEvent'

    BuildingEnvelope:
      type: object
      properties:
        code: { type: string }
        message: { type: string }
        data:
          $ref: '#/components/schemas/Building'

    BuildingUpdate:
      type: object
      properties:
        name: { type: string }
        building_type: { type: string }
        address: { type: string }
        description: { type: string }

    PartyUpdate:
      type: object
      properties:
        name: { type: string }
        party_type: { type: string, enum: [ORGANIZATION, PERSON] }
        contact_name: { type: string, nullable: true }
        contact_phone: { type: string, nullable: true }
        credit_code: { type: string, nullable: true }
        status: { type: string, enum: [ACTIVE, INACTIVE, ARCHIVED] }
        remark: { type: string, nullable: true }
      description: |
        主档更新。禁止 risk_status 经此接口变更；禁止主档 address/park_id。

    PartyRestoreBody:
      type: object
      properties:
        target_status: { type: string, enum: [ACTIVE, INACTIVE], default: ACTIVE }

    PartyRoleCreate:
      type: object
      required: [role_code]
      properties:
        role_code:
          type: string
          enum: [PROPERTY_OWNER, LESSEE, BROKER, SUPPLIER, PARTNER, CUSTOMER]

