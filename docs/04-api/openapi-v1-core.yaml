openapi: 3.1.0
info:
  title: KWZY AI Smart Park API
  version: 1.1.0
  description: |
    AI 智慧园区平台核心主链 OpenAPI v1.1（05.1 修订）。
    统一 snake_case；统一响应 envelope；Payment=收款登记；Bill 无 OVERDUE 主状态。
    覆盖：认证、园区/单元、合同、账单、收款催缴、线索转化。
    响应约定：成功/失败均为 {code, message, data}；错误见 ErrorResponse。
    路径与字段一律 snake_case。
servers:
  - url: http://localhost:8000/api/v1
    description: Local
tags:
  - name: Auth
  - name: Parks
  - name: Units
  - name: Parties
  - name: Leases
  - name: Bills
  - name: Payments
  - name: Collection
  - name: WorkItems
  - name: Leads
  - name: AI

paths:
  /auth/login:
    post:
      tags: [Auth]
      summary: 密码登录
      operationId: authLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'

  /auth/sms/send:
    post:
      tags: [Auth]
      summary: 发送登录短信验证码
      operationId: authSmsSend
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiOk'

  /auth/sms/login:
    post:
      tags: [Auth]
      summary: 短信验证码登录
      operationId: authSmsLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, code]
              properties:
                phone: { type: string }
                code: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'

  /auth/refresh:
    post:
      tags: [Auth]
      summary: 刷新访问令牌
      operationId: authRefresh
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'

  /auth/me:
    get:
      tags: [Auth]
      summary: 当前用户信息
      operationId: authMe
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInfo'


  /auth/page-access/send:
    post:
      tags: [Auth]
      summary: 发送高敏页面验证码（如催缴）
      operationId: authPageAccessSend
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [purpose]
              properties:
                purpose:
                  type: string
                  description: COLLECTION_SMS
                  example: COLLECTION_SMS
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelopeOk'

  /auth/page-access/verify:
    post:
      tags: [Auth]
      summary: 校验验证码并签发 page_access_proof
      operationId: authPageAccessVerify
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [purpose, code]
              properties:
                purpose: { type: string }
                code: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageAccessProofResponse'

  /auth/codes:
    get:
      tags: [Auth]
      summary: 当前用户权限码列表
      operationId: authCodes
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionCodesResponse'

  /auth/logout:
    post:
      tags: [Auth]
      summary: 登出（作废 refresh）
      operationId: authLogout
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelopeOk'

  /auth/password:
    post:
      tags: [Auth]
      summary: 修改当前用户密码
      operationId: authChangePassword
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [old_password, new_password]
              properties:
                old_password: { type: string }
                new_password: { type: string, minLength: 6 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelopeOk'

  /auth/menus:
    get:
      tags: [Auth]
      summary: 当前用户动态菜单
      operationId: authMenus
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelopeOk'

  /system/users:
    get:
      tags: [System]
      summary: 用户列表
      operationId: systemUsersList
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
    post:
      tags: [System]
      summary: 创建用户
      operationId: systemUsersCreate
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK

  /system/users/{user_id}:
    put:
      tags: [System]
      summary: 更新用户
      operationId: systemUsersUpdate
      security: [{ bearerAuth: [] }]
      parameters:
        - name: user_id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: OK
    delete:
      tags: [System]
      summary: 停用用户
      operationId: systemUsersDisable
      security: [{ bearerAuth: [] }]
      parameters:
        - name: user_id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: OK

  /system/roles:
    get:
      tags: [System]
      summary: 角色列表
      operationId: systemRolesList
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
    post:
      tags: [System]
      summary: 创建角色
      operationId: systemRolesCreate
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK

  /system/roles/{role_id}:
    put:
      tags: [System]
      summary: 更新角色
      operationId: systemRolesUpdate
      security: [{ bearerAuth: [] }]
      parameters:
        - name: role_id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: OK

  /system/permissions:
    get:
      tags: [System]
      summary: 权限码字典
      operationId: systemPermissionsList
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK

  /system/menus:
    get:
      tags: [System]
      summary: 菜单列表
      operationId: systemMenusList
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
    post:
      tags: [System]
      summary: 创建菜单
      operationId: systemMenusCreate
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK

  /parks:
    get:
      tags: [Parks]
      summary: 园区列表
      operationId: listParks
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: keyword
          in: query
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParkPage'
    post:
      tags: [Parks]
      summary: 创建园区
      operationId: createPark
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParkCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Park'

  /parks/{park_id}:
    get:
      tags: [Parks]
      summary: 园区详情
      operationId: getPark
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ParkIdPath'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Park'
    patch:
      tags: [Parks]
      summary: 更新园区
      operationId: updatePark
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ParkIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParkUpdate'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Park'

  /parks/{park_id}/buildings:
    get:
      tags: [Parks]
      summary: 楼栋列表
      operationId: listBuildings
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ParkIdPath'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Building'
    post:
      tags: [Parks]
      summary: 创建楼栋
      operationId: createBuilding
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ParkIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BuildingCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Building'


  /buildings/{building_id}:
    get:
      tags: [Parks]
      summary: 楼栋详情
      operationId: getBuilding
      security: [{ bearerAuth: [] }]
      parameters:
        - name: building_id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuildingEnvelope'
    patch:
      tags: [Parks]
      summary: 更新楼栋
      operationId: updateBuilding
      security: [{ bearerAuth: [] }]
      parameters:
        - name: building_id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BuildingUpdate'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuildingEnvelope'
    delete:
      tags: [Parks]
      summary: 删除楼栋（软删）
      operationId: deleteBuilding
      security: [{ bearerAuth: [] }]
      parameters:
        - name: building_id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelopeOk'

  /units:
    get:
      tags: [Units]
      summary: 可租单元列表
      operationId: listUnits
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: park_id
          in: query
          schema: { type: integer, format: int64 }
        - name: status
          in: query
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnitPage'
    post:
      tags: [Units]
      summary: 创建可租单元
      operationId: createUnit
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnitCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unit'

  /units/{unit_id}:
    get:
      tags: [Units]
      summary: 单元详情
      operationId: getUnit
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/UnitIdPath'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unit'
    patch:
      tags: [Units]
      summary: 更新单元
      operationId: updateUnit
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/UnitIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnitUpdate'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unit'

  /parties:
    get:
      tags: [Parties]
      summary: 主体列表（租户级，按园区可见性过滤）
      operationId: listParties
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: park_id
          in: query
          description: 按关联园区筛选（非主档归属）
          schema: { type: integer, format: int64 }
        - name: keyword
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string, enum: [ACTIVE, INACTIVE, ARCHIVED] }
        - name: risk_status
          in: query
          schema: { type: string, enum: [NORMAL, BLACKLISTED] }
        - name: party_type
          in: query
          schema: { type: string, enum: [ORGANIZATION, PERSON] }
        - name: include_archived
          in: query
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartyPageEnvelope'
    post:
      tags: [Parties]
      summary: 创建主体（可选 initial_park_relation 组合命令）
      operationId: createParty
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartyCreate'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartyEnvelope'

  /parties/{party_id}:
    get:
      tags: [Parties]
      summary: 主体详情
      operationId: getParty
      security: [{ bearerAuth: [] }]
      parameters:
        - name: party_id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartyEnvelope'
    patch:
      tags: [Parties]
      summary: 更新主体
      operationId: updateParty
      security: [{ bearerAuth: [] }]
      parameters:
        - name: party_id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartyUpdate'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartyEnvelope'

  /parties/{party_id}/archive:
    post:
      tags: [Parties]
      summary: 归档主体
      operationId: archiveParty
      security: [{ bearerAuth: [] }]
      parameters:
        - name: party_id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartyEnvelope'

  /parties/{party_id}/restore:
    post:
      tags: [Parties]
      summary: 恢复已归档主体
      operationId: restoreParty
      security: [{ bearerAuth: [] }]
      parameters:
        - name: party_id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartyRestoreBody'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartyEnvelope'

  /parties/{party_id}/roles:
    get:
      tags: [Parties]
      summary: 列出业务角色
      operationId: listPartyRoles
      security: [{ bearerAuth: [] }]
      parameters:
        - name: party_id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartyRoleListEnvelope'
    post:
      tags: [Parties]
      summary: 添加业务角色
      operationId: addPartyRole
      security: [{ bearerAuth: [] }]
      parameters:
        - name: party_id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartyRoleCreate'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartyRoleEnvelope'

  /parties/{party_id}/roles/{role_id}/deactivate:
    post:
      tags: [Parties]
      summary: 停用业务角色
      operationId: deactivatePartyRole
      security: [{ bearerAuth: [] }]
      parameters:
        - name: party_id
          in: path
          required: true
          schema: { type: integer, format: int64 }
        - name: role_id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartyRoleEnvelope'

  /parties/{party_id}/park-relations:
    get:
      tags: [Parties]
      summary: 列出 Party-Park 关系
      operationId: listPartyParkRelations
      security: [{ bearerAuth: [] }]
      parameters:
        - name: party_id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartyParkRelationListEnvelope'
    post:
      tags: [Parties]
      summary: 添加 Party-Park 关系
      operationId: addPartyParkRelation
      security: [{ bearerAuth: [] }]
      parameters:
        - name: party_id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartyParkRelationCreate'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartyParkRelationEnvelope'

  /parties/{party_id}/park-relations/{relation_id}/end:
    post:
      tags: [Parties]
      summary: 结束 Party-Park 关系
      operationId: endPartyParkRelation
      security: [{ bearerAuth: [] }]
      parameters:
        - name: party_id
          in: path
          required: true
          schema: { type: integer, format: int64 }
        - name: relation_id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartyParkRelationEnvelope'

  /parties/{party_id}/contacts:
    get:
      tags: [Parties]
      summary: 联系人列表
      operationId: listPartyContacts
      security: [{ bearerAuth: [] }]
      parameters:
        - name: party_id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartyContactListEnvelope'
    post:
      tags: [Parties]
      summary: 创建联系人
      operationId: createPartyContact
      security: [{ bearerAuth: [] }]
      parameters:
        - name: party_id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartyContactCreate'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartyContactEnvelope'

  /parties/{party_id}/contacts/{contact_id}:
    patch:
      tags: [Parties]
      summary: 更新联系人
      operationId: updatePartyContact
      security: [{ bearerAuth: [] }]
      parameters:
        - name: party_id
          in: path
          required: true
          schema: { type: integer, format: int64 }
        - name: contact_id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartyContactUpdate'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartyContactEnvelope'
    delete:
      tags: [Parties]
      summary: 软删除联系人
      operationId: deletePartyContact
      security: [{ bearerAuth: [] }]
      parameters:
        - name: party_id
          in: path
          required: true
          schema: { type: integer, format: int64 }
        - name: contact_id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiOk'

  /parties/{party_id}/addresses:
    get:
      tags: [Parties]
      summary: 地址列表（ORGANIZATION；PERSON v1 禁止）
      description: |
        ORGANIZATION：返回可见地址。
        PERSON：v1 一律 403 PERSON_ADDRESS_FORBIDDEN（含库中已有行），不返回任何地址字段。
      operationId: listPartyAddresses
      security: [{ bearerAuth: [] }]
      parameters:
        - name: party_id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartyAddressListEnvelope'
        '403':
          description: PERSON 主体地址禁止访问
          content:
            application/json:
              schema:
