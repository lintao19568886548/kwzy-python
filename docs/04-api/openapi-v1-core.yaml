      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: page_size
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 20 }
    ParkIdPath:
      name: park_id
      in: path
      required: true
      schema: { type: integer, format: int64 }
    UnitIdPath:
      name: unit_id
      in: path
      required: true
      schema: { type: integer, format: int64 }
    AssetTemplateIdPath:
      name: template_id
      in: path
      required: true
      schema: { type: integer, format: int64 }
    RentControlParkId:
      name: park_id
      in: query
      schema: { type: integer, format: int64 }
    RentControlSpaceId:
      name: space_id
      in: query
      schema: { type: integer, format: int64 }
    RentControlStatus:
      name: status
      in: query
      schema: { type: string, enum: [DRAFT, VACANT, RESERVED, OCCUPIED, MAINTENANCE, RETIRED] }
    RentControlUsageType:
      name: usage_type
      in: query
      schema: { type: string }
    RentControlKeyword:
      name: keyword
      in: query
      schema: { type: string }
    LeaseIdPath:
      name: lease_id
      in: path
      required: true
      schema: { type: integer, format: int64 }
    ContractIdPath:
      name: contract_id
      in: path
      required: true
      schema: { type: integer, format: int64 }
    DocumentIdPath:
      name: document_id
      in: path
      required: true
      schema: { type: integer, format: int64 }
    ChangeIdPath:
      name: change_id
      in: path
      required: true
      schema: { type: integer, format: int64 }
    SettlementIdPath:
      name: settlement_id
      in: path
      required: true
      schema: { type: integer, format: int64 }
    BillIdPath:
      name: bill_id
      in: path
      required: true
      schema: { type: integer, format: int64 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 128
      description: 写操作幂等键（payments 创建、bills issue 等必须支持；1–128 字符，不作为授权边界）
    IdempotencyKeyRequired:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
      description: 必填命令幂等键；同租户同来源重放必须返回原结果，不同载荷复用返回 409。
    WorkOrderIdPath:
      name: work_order_id
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    WorkOrderQuoteIdPath:
      name: quote_id
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    WorkOrderCostIdPath:
      name: cost_id
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    GroupId:
      name: group_id
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    RegionId:
      name: region_id
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    PositionId:
      name: position_id
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    AssignmentId:
      name: assignment_id
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    PartyIdPath:
      name: party_id
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    EnterpriseCredentialIdPath:
      name: credential_id
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }

  responses:
    ApiOkResponse:
      description: 统一成功响应
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiOk' }
    OrganizationGovernanceOK:
      description: 组织治理统一成功响应
      content:
        application/json:
          schema: { $ref: '#/components/schemas/OrganizationGovernanceEnvelope' }
    Forbidden:
      description: 动作权限、园区范围或租户边界拒绝
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Conflict:
      description: 生命周期、有效期或并发唯一约束冲突
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }

  schemas:
    WorkOrderCreate:
      type: object
      additionalProperties: false
      required: [park_id, title]
      properties:
        park_id: { type: integer, format: int64, minimum: 1 }
        party_id: { type: integer, format: int64, minimum: 1, nullable: true }
        contact_id: { type: integer, format: int64, minimum: 1, nullable: true }
        contact_name: { type: string, maxLength: 64, nullable: true }
        contact_phone: { type: string, maxLength: 32, nullable: true }
        title: { type: string, minLength: 1, maxLength: 255 }
        description: { type: string, maxLength: 2000, nullable: true }
        category: { type: string, minLength: 1, maxLength: 64, default: GENERAL }
        priority: { type: string, enum: [LOW, MEDIUM, HIGH, URGENT], default: MEDIUM }
        unit_id: { type: integer, format: int64, minimum: 1, nullable: true }
        quote_required: { type: boolean, default: false }
        request_source:
          type: string
          enum: [PROPERTY_STAFF, PHONE, FRONT_DESK, OTHER]
          default: PROPERTY_STAFF
    TenantServiceRequestCreate:
      type: object
      additionalProperties: false
      required: [park_id, title]
      properties:
        park_id: { type: integer, format: int64, minimum: 1 }
        contact_id: { type: integer, format: int64, minimum: 1, nullable: true }
        contact_name: { type: string, maxLength: 64, nullable: true }
        contact_phone: { type: string, maxLength: 32, nullable: true }
        title: { type: string, minLength: 1, maxLength: 255 }
        description: { type: string, maxLength: 2000, nullable: true }
        category: { type: string, minLength: 1, maxLength: 64, default: GENERAL }
        priority: { type: string, enum: [LOW, MEDIUM, HIGH, URGENT], default: MEDIUM }
        unit_id: { type: integer, format: int64, minimum: 1, nullable: true }
        quote_required: { type: boolean, default: false }
    TenantServicePrincipalGrant:
      type: object
      additionalProperties: false
      required: [user_id, party_id, park_ids]
      properties:
        user_id: { type: integer, format: int64, minimum: 1 }
        party_id: { type: integer, format: int64, minimum: 1 }
        park_ids:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items: { type: integer, format: int64, minimum: 1 }
    WorkOrderAssignmentRuleCreate:
      type: object
      additionalProperties: false
      required: [code, name, assignee_user_id, response_minutes, resolution_minutes]
      properties:
        code: { type: string, minLength: 2, maxLength: 64, pattern: '^[A-Z][A-Z0-9_]*$' }
        name: { type: string, minLength: 1, maxLength: 128 }
        park_id: { type: integer, format: int64, minimum: 1, nullable: true }
        category: { type: string, maxLength: 64, nullable: true }
        priority: { type: string, enum: [LOW, MEDIUM, HIGH, URGENT], nullable: true }
        assignee_user_id: { type: integer, format: int64, minimum: 1 }
        response_minutes: { type: integer, minimum: 1, maximum: 43200 }
        resolution_minutes: { type: integer, minimum: 1, maximum: 525600 }
        sort_order: { type: integer, minimum: 0, maximum: 100000, default: 100 }
    WorkOrderAssignmentRuleRetire:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 1000 }
    WorkOrderExpectedVersion:
      type: object
      additionalProperties: false
      required: [expected_version]
      properties:
        expected_version: { type: integer, minimum: 1 }
    WorkOrderDispatch:
      type: object
      additionalProperties: false
      required: [expected_version, assignee_user_id, reason]
      properties:
        expected_version: { type: integer, minimum: 1 }
        assignee_user_id: { type: integer, format: int64, minimum: 1 }
        reason: { type: string, minLength: 1, maxLength: 1000 }
    WorkOrderCancel:
      type: object
      additionalProperties: false
      required: [expected_version, reason]
      properties:
        expected_version: { type: integer, minimum: 1 }
        reason: { type: string, minLength: 1, maxLength: 1000 }
    WorkOrderQuoteLine:
      type: object
      additionalProperties: false
      required: [line_type, description, quantity, unit, unit_price]
      properties:
        line_type: { type: string, enum: [LABOR, MATERIAL, OUTSOURCE, OTHER] }
        description: { type: string, minLength: 1, maxLength: 255 }
        quantity: { type: number, exclusiveMinimum: 0, multipleOf: 0.0001 }
        unit: { type: string, minLength: 1, maxLength: 32 }
        unit_price: { type: number, minimum: 0, multipleOf: 0.01 }
        amount: { type: number, minimum: 0, multipleOf: 0.01, nullable: true }
    WorkOrderQuoteCreate:
      type: object
      additionalProperties: false
      required: [expected_version, lines]
      properties:
        expected_version: { type: integer, minimum: 1 }
        currency: { type: string, minLength: 3, maxLength: 3, default: CNY }
        total_amount: { type: number, minimum: 0, multipleOf: 0.01, nullable: true }
        remark: { type: string, maxLength: 1000, nullable: true }
        lines:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: '#/components/schemas/WorkOrderQuoteLine' }
    WorkOrderQuoteDecision:
      type: object
      additionalProperties: false
      required: [expected_version, decision]
      properties:
        expected_version: { type: integer, minimum: 1 }
        decision: { type: string, enum: [ACCEPT, REJECT] }
        remark: { type: string, maxLength: 1000, nullable: true }
    WorkOrderCostCreate:
      type: object
      additionalProperties: false
      required: [expected_version, entry_type, description, quantity, unit, unit_price]
      properties:
        expected_version: { type: integer, minimum: 1 }
        entry_type: { type: string, enum: [LABOR, MATERIAL, OUTSOURCE, OTHER] }
        description: { type: string, minLength: 1, maxLength: 255 }
        quantity: { type: number, exclusiveMinimum: 0, multipleOf: 0.0001 }
        unit: { type: string, minLength: 1, maxLength: 32 }
        unit_price: { type: number, minimum: 0, multipleOf: 0.01 }
    WorkOrderCostReverse:
      type: object
      additionalProperties: false
      required: [expected_version, reason]
      properties:
        expected_version: { type: integer, minimum: 1 }
        reason: { type: string, minLength: 1, maxLength: 1000 }
    WorkOrderCompletion:
      type: object
      additionalProperties: false
      required: [expected_version, resolution_summary]
      properties:
        expected_version: { type: integer, minimum: 1 }
        resolution_summary: { type: string, minLength: 1, maxLength: 2000 }
        evidence_refs:
          type: array
          maxItems: 20
          items: { type: string }
        no_evidence_reason: { type: string, maxLength: 512, nullable: true }
    WorkOrderAcceptance:
      type: object
      additionalProperties: false
      required: [expected_version, decision]
      properties:
        expected_version: { type: integer, minimum: 1 }
        decision: { type: string, enum: [ACCEPTED, REWORK] }
        comment: { type: string, maxLength: 1000, nullable: true }
    WorkOrderRating:
      type: object
      additionalProperties: false
      required: [score]
      properties:
        score: { type: integer, minimum: 1, maximum: 5 }
        tags:
          type: array
          maxItems: 10
          items: { type: string }
        comment: { type: string, maxLength: 1000, nullable: true }
    WorkOrderSlaSweep:
      type: object
      additionalProperties: false
      properties:
        as_of: { type: string, format: date-time, nullable: true }
    ReceiptCreate:
      type: object
      additionalProperties: false
      required: [park_id, amount, received_at, channel, source_ref]
      properties:
        park_id: { type: integer, format: int64, minimum: 1 }
        party_id: { type: integer, format: int64, minimum: 1, nullable: true }
        amount: { type: number, exclusiveMinimum: 0 }
        currency: { type: string, minLength: 3, maxLength: 3, default: CNY }
        received_at: { type: string, format: date-time }
        channel:
          type: string
          enum: [BANK_IMPORT, BANK_API, OFFLINE_TRANSFER, PAYMENT_LINK, WECHAT, ALIPAY, AGGREGATE, CASH, POS]
        source_provider: { type: string, minLength: 1, maxLength: 64, default: MANUAL }
        source_ref: { type: string, minLength: 1, maxLength: 128 }
        payer_name: { type: string, maxLength: 128, nullable: true }
        payer_account:
          type: string
          maxLength: 128
          nullable: true
          writeOnly: true
        bank_reference: { type: string, maxLength: 128, nullable: true }
        purpose: { type: string, maxLength: 512, nullable: true }

    ReceivableVersionCommand:
      type: object
      additionalProperties: false
      required: [expected_version]
      properties:
        expected_version: { type: integer, minimum: 1 }

    ReceiptConfirm:
      type: object
      additionalProperties: false
      required: [expected_version]
      properties:
        expected_version: { type: integer, minimum: 1 }
        party_id: { type: integer, format: int64, minimum: 1, nullable: true }
        allocations:
          type: array
          maxItems: 200
          nullable: true
          items: { $ref: '#/components/schemas/PaymentAllocationInput' }
        remark: { type: string, maxLength: 1000, nullable: true }

    ReceiptException:
      type: object
      additionalProperties: false
      required: [expected_version, code, remark]
      properties:
        expected_version: { type: integer, minimum: 1 }
        code: { type: string, minLength: 1, maxLength: 64 }
        remark: { type: string, minLength: 1, maxLength: 1000 }

    ReceiptDispute:
      type: object
      additionalProperties: false
      required: [expected_version, reason]
      properties:
        expected_version: { type: integer, minimum: 1 }
        reason: { type: string, minLength: 1, maxLength: 1000 }

    ReceiptDisputeDecision:
      type: object
      additionalProperties: false
      required: [expected_version, decision, remark]
      properties:
        expected_version: { type: integer, minimum: 1 }
        decision: { type: string, enum: [RETURN_TO_FINANCE, REJECT_RECEIPT] }
        remark: { type: string, minLength: 1, maxLength: 1000 }

    PaymentAllocate:
      type: object
      additionalProperties: false
      required: [allocations]
      properties:
        allocations:
          type: array
          minItems: 1
          maxItems: 200
          items: { $ref: '#/components/schemas/PaymentAllocationInput' }

    DunningRunCommand:
      type: object
      additionalProperties: false
      required: [as_of]
      properties:
        as_of: { type: string, format: date }
        park_id: { type: integer, format: int64, minimum: 1, nullable: true }

    ReceivableAdjustmentCreate:
      type: object
      additionalProperties: false
      required: [bill_id, adjustment_type, reason]
      properties:
        bill_id: { type: integer, format: int64, minimum: 1 }
        adjustment_type: { type: string, enum: [WAIVER, EXTENSION, BAD_DEBT, DISPUTE, DISPUTE_RESOLUTION] }
        amount: { type: number, exclusiveMinimum: 0, nullable: true }
        requested_due_date: { type: string, format: date, nullable: true }
        reason: { type: string, minLength: 1, maxLength: 1000 }

    # ----- 统一响应 envelope（P0-3）-----
    ApiEnvelopeOk:
      type: object
      required: [code, message, data]
      properties:
        code: { type: string, example: OK }
        message: { type: string, example: success }
        data: { type: object, nullable: true }

    ErrorResponse:
      type: object
      required: [code, message, data]
      properties:
        code: { type: string, example: VALIDATION_ERROR }
        message: { type: string }
        data: { type: object, nullable: true }

    OrganizationGovernanceEnvelope:
      type: object
      required: [code, message, data]
      properties:
        code: { type: string, example: OK }
        message: { type: string }
        data:
          description: 按端点返回层级、主档、历史或策略对象

    OrganizationLifecycleStatus:
      type: string
      enum: [ACTIVE, DISABLED]

    OrganizationGroupCreate:
      type: object
      required: [code, name]
      properties:
        code: { type: string, minLength: 1, maxLength: 64, pattern: '^[A-Za-z0-9_.-]+$' }
        name: { type: string, minLength: 1, maxLength: 128 }
        sort_order: { type: integer, minimum: -100000, maximum: 100000, default: 0 }
        remark: { type: string, maxLength: 500, nullable: true }

    OrganizationGroupUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 128 }
        status: { $ref: '#/components/schemas/OrganizationLifecycleStatus' }
        sort_order: { type: integer, minimum: -100000, maximum: 100000 }
        remark: { type: string, maxLength: 500, nullable: true }

    OrganizationRegionCreate:
      allOf:
        - $ref: '#/components/schemas/OrganizationGroupCreate'
        - type: object
          required: [group_id]
          properties:
            group_id: { type: integer, format: int64, minimum: 1 }

    OrganizationRegionUpdate:
      allOf:
        - $ref: '#/components/schemas/OrganizationGroupUpdate'
        - type: object
          properties:
            group_id: { type: integer, format: int64, minimum: 1 }

    RegionParkAssignmentCommand:
      type: object
      required: [region_id, park_id]
      properties:
        region_id: { type: integer, format: int64, minimum: 1 }
        park_id: { type: integer, format: int64, minimum: 1 }
        effective_from: { type: string, format: date-time, nullable: true }
        reason: { type: string, maxLength: 500, nullable: true }

    PositionCreate:
      type: object
      required: [code, name]
      properties:
        code: { type: string, minLength: 1, maxLength: 64, pattern: '^[A-Za-z0-9_.-]+$' }
        name: { type: string, minLength: 1, maxLength: 128 }
        org_unit_id: { type: integer, format: int64, minimum: 1, nullable: true }
        sort_order: { type: integer, minimum: -100000, maximum: 100000, default: 0 }
        responsibilities: { type: string, maxLength: 5000, nullable: true }

    PositionUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 128 }
        org_unit_id: { type: integer, format: int64, minimum: 1, nullable: true }
        clear_org_unit: { type: boolean, default: false }
        status: { $ref: '#/components/schemas/OrganizationLifecycleStatus' }
        sort_order: { type: integer, minimum: -100000, maximum: 100000 }
        responsibilities: { type: string, maxLength: 5000, nullable: true }

    UserPositionAssignmentCreate:
      type: object
      required: [user_id, position_id]
      properties:
        user_id: { type: integer, format: int64, minimum: 1 }
        position_id: { type: integer, format: int64, minimum: 1 }
        park_id: { type: integer, format: int64, minimum: 1, nullable: true }
        starts_at: { type: string, format: date-time, nullable: true }
        is_primary: { type: boolean, default: false }
        remark: { type: string, maxLength: 500, nullable: true }

    UserPositionAssignmentEnd:
      type: object
      properties:
        ends_at: { type: string, format: date-time, nullable: true }
        remark: { type: string, maxLength: 500, nullable: true }

    FieldAccessPolicyUpsert:
      type: object
      required: [role_id, resource_type, field_name, access_mode]
      properties:
        role_id: { type: integer, format: int64, minimum: 1 }
        resource_type: { type: string, enum: [USER] }
        field_name: { type: string, enum: [phone] }
        access_mode: { type: string, enum: [VISIBLE, MASKED, HIDDEN] }
        mask_strategy: { type: string, enum: [PHONE], default: PHONE }
        status: { $ref: '#/components/schemas/OrganizationLifecycleStatus' }

    LeaseVersionCommandV2:
      type: object
      required: [expected_version]
      properties:
        expected_version: { type: integer, minimum: 1 }
        remark: { type: string, maxLength: 1000, nullable: true }

    LeaseApprovalCommandV2:
      allOf:
        - $ref: '#/components/schemas/LeaseVersionCommandV2'
        - type: object
          required: [approval_id]
          properties:
            approval_id: { type: integer, minimum: 1 }
            override_reason: { type: string, maxLength: 1000, nullable: true }

    LeaseChargeLineV2:
      type: object
      required: [charge_code, charge_type, calculation_method, billing_cycle, start_date, end_date]
      properties:
        charge_code: { type: string, minLength: 1, maxLength: 64 }
        charge_type: { type: string, minLength: 1, maxLength: 32 }
        calculation_method: { type: string, enum: [FIXED, PER_AREA] }
        billing_cycle: { type: string, enum: [MONTHLY, QUARTERLY, SEMI_ANNUAL, ANNUAL, ONE_TIME] }
        currency: { type: string, default: CNY }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date }
        due_day: { type: integer, minimum: 1, maximum: 31, default: 1 }
        amount: { type: number, nullable: true }
        unit_price: { type: number, nullable: true }
        tax_rate: { type: number, default: 0 }
        sort_order: { type: integer, default: 0 }
        rules:
          type: array
          items: { type: object, additionalProperties: true }

    LeaseChargeReplaceV2:
      type: object
      required: [expected_version, charges]
      properties:
        expected_version: { type: integer, minimum: 1 }
        charges:
          type: array
          items: { $ref: '#/components/schemas/LeaseChargeLineV2' }

    LeaseSchedulePreviewV2:
      type: object
      required: [expected_version]
      properties:
        expected_version: { type: integer, minimum: 1 }
        charges:
          type: array
          nullable: true
          items: { $ref: '#/components/schemas/LeaseChargeLineV2' }

    LeaseDocumentCreateV2:
      type: object
      required: [expected_version, attachment_id, document_type, checksum]
      properties:
        expected_version: { type: integer, minimum: 1 }
        attachment_id: { type: integer, minimum: 1 }
        document_type: { type: string, minLength: 1, maxLength: 32 }
        checksum: { type: string, minLength: 64, maxLength: 64 }
        is_main: { type: boolean, default: false }
        exit_settlement_id: { type: integer, minimum: 1, nullable: true }

    LeaseDocumentCommandV2:
      type: object
      required: [expected_version]
      properties:
        expected_version: { type: integer, minimum: 1 }

    LeaseChangeCreateV2:
      type: object
      required: [expected_version, change_type, effective_date, reason, proposed_snapshot]
      properties:
        expected_version: { type: integer, minimum: 1 }
        change_type:
          type: string
          enum: [RENEWAL, EXPANSION, REDUCTION, UNIT_TRANSFER, PRICE_ADJUSTMENT, PARTY_TRANSFER, EARLY_TERMINATION]
        effective_date: { type: string, format: date }
        reason: { type: string, minLength: 1, maxLength: 2000 }
        proposed_snapshot: { type: object, additionalProperties: true }
        target_party_eligible: { type: boolean, nullable: true }

    LeaseChangeDecisionV2:
      type: object
      required: [expected_version]
      properties:
        expected_version: { type: integer, minimum: 1 }
        remark: { type: string, maxLength: 1000, nullable: true }
        override_reason: { type: string, maxLength: 1000, nullable: true }

    LeaseChangeApplyV2:
      type: object
      required: [expected_version, idempotency_key]
      properties:
        expected_version: { type: integer, minimum: 1 }
        idempotency_key: { type: string, minLength: 1, maxLength: 160 }
        as_of: { type: string, format: date, nullable: true }

    LeaseApplyDueV2:
      type: object
      properties:
        as_of: { type: string, format: date, nullable: true }
        limit: { type: integer, minimum: 1, maximum: 200, default: 100 }

    LeaseExitCreateV2:
      type: object
      required: [expected_version, handover_date]
      properties:
        expected_version: { type: integer, minimum: 1 }
        handover_date: { type: string, format: date }
        inspection_summary: { type: string, maxLength: 4000, nullable: true }

    LeaseExitItemV2:
      type: object
      required: [item_type, amount, description]
      properties:
        item_type: { type: string, minLength: 1, maxLength: 32 }
        amount: { type: number }
        description: { type: string, minLength: 1, maxLength: 255 }
        approved: { type: boolean, default: true }
