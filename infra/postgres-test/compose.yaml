# Disposable PostgreSQL 16 for Party / integration tests.
# Localhost only. Credentials via env (see .env.example). Never commit real passwords.
#
# Usage (from repo root):
#   copy .env.example to .env and set POSTGRES_PASSWORD
#   docker compose -f infra/postgres-test/compose.yaml up -d
#   docker compose -f infra/postgres-test/compose.yaml down

services:
  kwzy_party_test_pg:
    image: postgres:16
    container_name: kwzy_party_test_pg
    restart: "no"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kwzy_party_test}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-kwzy_party_test}
    ports:
      # Bind localhost only (never 0.0.0.0)
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - kwzy_party_test_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 5s
    networks:
      - kwzy_party_test_net

volumes:
  kwzy_party_test_pgdata:
    name: kwzy_party_test_pgdata

networks:
  kwzy_party_test_net:
    name: kwzy_party_test_net
