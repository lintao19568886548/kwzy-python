name: acceptance

on:
  pull_request:
  push:
    branches: [main, "audit/**"]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kwzy_ci
          POSTGRES_PASSWORD: kwzy_ci_only
          POSTGRES_DB: kwzy_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kwzy_ci -d kwzy_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      APP_ENV: test
      DEBUG: "false"
      ALLOW_ANON_DEV: "false"
      JWT_SECRET: ci-jwt-secret-not-for-production-32-bytes
      DATABASE_URL: postgresql+psycopg://kwzy_ci:kwzy_ci_only@127.0.0.1:5432/kwzy_ci
      TEST_DATABASE_URL: postgresql+psycopg://kwzy_ci:kwzy_ci_only@127.0.0.1:5432/kwzy_ci
      POSTGRES_TEST_URL: postgresql+psycopg://kwzy_ci:kwzy_ci_only@127.0.0.1:5432/kwzy_ci
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: python -m pip install pip-audit
      - run: python -m pip_audit --local --progress-spinner off
      - run: alembic upgrade head
      - run: alembic downgrade -1
      - run: alembic upgrade head
      - run: python -m pytest -q --tb=line

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build

  deployment-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate production Compose contract (no deployment)
        env:
          KWZY_API_IMAGE: example.invalid/kwzy-api:sha
          KWZY_WEB_IMAGE: example.invalid/kwzy-web:sha
          DATABASE_URL: postgresql+psycopg://user:password@db.example.invalid:5432/kwzy
          JWT_SECRET: validation-only-secret-at-least-32-bytes
          CORS_ORIGINS: https://kwzy.example.invalid
          TRUSTED_HOSTS: kwzy.example.invalid
          SMS_API_KEY: validation-only
          WECHAT_APP_ID: validation-only
          WECHAT_APP_SECRET: validation-only
          OSS_ENDPOINT: https://oss.example.invalid
          OSS_BUCKET: validation-only
          OSS_ACCESS_KEY: validation-only
          OSS_SECRET_KEY: validation-only
        run: docker compose -f infra/production/compose.production.example.yaml config -q
